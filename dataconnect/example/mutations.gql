) @auth(level: USER) @transaction {
  query @redact {
    administrador: usuario(id_expr: "auth.uid")
      @check(expr: "this != null", message: "Administrador no encontrado") {
      activo @check(expr: "this == true", message: "La cuenta administradora está inactiva")
      rol {
        nombre @check(expr: "this == 'admin'", message: "Solo administradores pueden crear clientes")
      }
    }
    rolCliente: rol(first: { where: { nombre: { eq: "cliente" } } })
      @check(expr: "this != null", message: "El rol cliente no está configurado") {
      id
    }
  }
  usuario_insert(data: {
    id: $id
    rolId_expr: "response.query.rolCliente.id"
    rut: $rut
    nombre: $nombre
    apellido: $apellido
    telefono: $telefono
    email: $email
  })
  cliente_insert(data: {
    usuario: { id: $id }
    nombre: $nombre
    tipoCliente: $tipoCliente
    telefono: $telefono
    email: $email
    direccion: $direccion
  })
}

# Edita una cuenta existente (rol, datos y estado activo/inactivo). Solo
# administradores; el formulario siempre envía el estado completo del usuario.
mutation ActualizarUsuario(
  $id: String!
  $rolId: UUID!
  $nombre: String!
  $apellido: String
  $telefono: String
  $activo: Boolean!
) @auth(level: USER) @transaction {
  query @redact {
    usuario(id_expr: "auth.uid") {
      activo @check(expr: "this == true", message: "La cuenta está inactiva")
      rol {
        nombre @check(expr: "this == 'admin'", message: "Solo administradores pueden editar usuarios")
      }
    }
  }
  usuario_update(
    id: $id
    data: {
      rol: { id: $rolId }
      nombre: $nombre
      apellido: $apellido
      telefono: $telefono
      activo: $activo
      actualizadoEn_expr: "request.time"
    }
  )
}

