# Operación heredada conservada temporalmente para compatibilidad del conector.
# Ya no es invocable desde clientes porque permitía que una cuenta recién creada
# eligiera su propio rol. Las altas nuevas usan CrearUsuarioAdministrado.
mutation Registrarse(
  $rolId: UUID!
  $rut: String!
  $nombre: String!
  $apellido: String!
  $telefono: String
  $email: String!
) @auth(level: NO_ACCESS) {
  usuario_insert(data: {
    id_expr: "auth.uid"
    rol: { id: $rolId }
    rut: $rut
    nombre: $nombre
    apellido: $apellido
    telefono: $telefono
    email: $email
  })
}

# Alta administrativa para roles internos. La operación la ejecuta la sesión
# principal del administrador y recibe el uid creado en la app Auth secundaria.
mutation CrearUsuarioAdministrado(
  $id: String!
  $rolId: UUID!
  $rut: String!
  $nombre: String!
  $apellido: String!
  $telefono: String
  $email: String!
) @auth(level: USER) @transaction {
  query @redact {
    administrador: usuario(id_expr: "auth.uid")
      @check(expr: "this != null", message: "Administrador no encontrado") {
      activo @check(expr: "this == true", message: "La cuenta administradora está inactiva")
      rol {
        nombre @check(expr: "this == 'admin'", message: "Solo administradores pueden crear usuarios")
      }
    }
    rolDestino: rol(id: $rolId)
      @check(expr: "this != null", message: "Rol no encontrado") {
      nombre @check(
        expr: "this != 'cliente'"
        message: "Los clientes deben crearse con la operación administrativa de clientes"
      )
    }
  }
  usuario_insert(data: {
    id: $id
    rol: { id: $rolId }
    rut: $rut
    nombre: $nombre
    apellido: $apellido
    telefono: $telefono
    email: $email
  })
}

# Auto-registro para clientes: crea el Usuario y su ficha de Cliente enlazada
# en una sola transacción (Cliente.usuario solo se llena si el cliente creó cuenta).
mutation RegistrarseComoCliente(
  $rolId: UUID @retired(reason: "El rol cliente ahora se resuelve en el servidor")
  $rut: String!
  $nombre: String!
  $apellido: String!
  $telefono: String
  $email: String!
  $direccion: String
  $tipoCliente: TipoCliente!
) @auth(level: USER) @transaction {
  query @redact {
    rolCliente: rol(first: { where: { nombre: { eq: "cliente" } } })
      @check(expr: "this != null", message: "El rol cliente no está configurado") {
      id
    }
  }
  usuario_insert(data: {
    id_expr: "auth.uid"
    rolId_expr: "response.query.rolCliente.id"
    rut: $rut
    nombre: $nombre
    apellido: $apellido
    telefono: $telefono
    email: $email
  })
  cliente_insert(data: {
    usuario: { id_expr: "auth.uid" }
    nombre: $nombre
    tipoCliente: $tipoCliente
    telefono: $telefono
    email: $email
    direccion: $direccion
  })
}

# Alta de cliente realizada desde la intranet. La autorización corresponde a
# la sesión principal del administrador y el rol cliente se resuelve en servidor.
