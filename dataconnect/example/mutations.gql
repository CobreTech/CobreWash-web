mutation AgregarComandaDetalle(
  $comandaId: UUID!
  $tipoPrendaId: UUID!
  $tipoServicioId: UUID!
  $cantidad: Int!
  $detalle: String
  $precioUnitario: Float!
  $subtotal: Float!
) @auth(level: USER) @transaction {
  query @redact {
    usuario(id_expr: "auth.uid") {
      activo @check(expr: "this == true", message: "La cuenta está inactiva")
      rol {
        nombre @check(expr: "this == 'admin' || this == 'recepcionista'", message: "No autorizado para modificar comandas")
      }
    }
    comanda(id: $comandaId)
      @check(expr: "this != null", message: "Comanda no encontrada") {
      estado @check(expr: "this == 'PENDIENTE'", message: "Solo se pueden agregar prendas a una comanda pendiente")
    }
  }
  comandaDetalle_insert(data: {
    comanda: { id: $comandaId }
    tipoPrenda: { id: $tipoPrendaId }
    tipoServicio: { id: $tipoServicioId }
    cantidad: $cantidad
    detalle: $detalle
    precioUnitario: $precioUnitario
    subtotal: $subtotal
  })
}

mutation AnularComanda(
  $id: UUID!
  $motivoAnulacion: String!
) @auth(level: USER) @transaction {
  query @redact {
    usuario(id_expr: "auth.uid") {
      activo @check(expr: "this == true", message: "La cuenta está inactiva")
      rol { nombre @check(expr: "this == 'admin' || this == 'recepcionista'", message: "No autorizado para anular comandas") }
    }
    comanda(id: $id)
      @check(expr: "this != null", message: "Comanda no encontrada") {
      estado @check(expr: "this != 'ENTREGADA' && this != 'ANULADA'", message: "La comanda ya está cerrada")
    }
  }
  comanda_update(
    id: $id
    data: {
      estado: ANULADA
      motivoAnulacion: $motivoAnulacion
      actualizadoEn_expr: "request.time"
    }
  ) @check(expr: "this != null", message: "Comanda no encontrada")
  
  comandaHistorialEstado_insert(data: {
    comanda: { id: $id }
    usuarioId_expr: "auth.uid"
    estadoNuevo: ANULADA
    motivo: $motivoAnulacion
  })
}

mutation EntregarComanda(
  $id: UUID!
) @auth(level: USER) @transaction {
  query @redact {
    usuario(id_expr: "auth.uid") {
      activo @check(expr: "this == true", message: "La cuenta está inactiva")
      rol { nombre @check(expr: "this == 'admin' || this == 'recepcionista'", message: "No autorizado para entregar comandas") }
    }
    comanda(id: $id)
      @check(expr: "this != null", message: "Comanda no encontrada") {
      estado @check(expr: "this == 'FINALIZADA'", message: "Solo se puede entregar una comanda finalizada")
      cliente { email telefono }
    }
  }
  comanda_update(
    id: $id
    data: {
      estado: ENTREGADA
      fechaEntregaReal_expr: "request.time"
      actualizadoEn_expr: "request.time"
    }
  ) @check(expr: "this != null", message: "Comanda no encontrada")
  
  comandaHistorialEstado_insert(data: {
    comanda: { id: $id }
    usuarioId_expr: "auth.uid"
    estadoNuevo: ENTREGADA
    motivo: "Entrega a cliente"
  })
  comandaNotificacion_insert(data: {
    comanda: { id: $id }
    destinatario_expr: "response.query.comanda.cliente.email"
    mensaje: "Su comanda fue entregada correctamente"
  })
}


