query GetSolicitudContactoConfirmada($id: UUID!) @auth(level: NO_ACCESS) {
  solicitudContacto(id: $id) { id hashContenido }
}

mutation PrepararLimiteContacto($id: String!) @auth(level: NO_ACCESS) {
  limiteContacto_insert(data: { id: $id, contador: 0 })
}
query GetLimiteContacto($id: String!) @auth(level: NO_ACCESS) {
  limiteContacto(id: $id) { id }
}

mutation RegistrarSolicitudContacto($id: UUID!, $nombre: String!, $email: String!, $telefono: String!, $servicio: String!, $mensaje: String!, $hashContenido: String!, $limiteId: String!, $versionPrivacidad: String!) @auth(level: NO_ACCESS) @transaction {
  limiteContacto_update(first: { where: { id: { eq: $limiteId }, contador: { lt: 5 } } }, data: { contador_update: { inc: 1 } })
    @check(expr: "this != null", message: "Límite de solicitudes alcanzado")
  solicitudContacto_insert(data: { id: $id, nombre: $nombre, email: $email, telefono: $telefono, servicio: $servicio, mensaje: $mensaje, hashContenido: $hashContenido, versionPrivacidad: $versionPrivacidad, autorizadaEn_expr: "request.time" })
}

query GetSolicitudesContacto($estado: SolicitudContactoEstado, $limit: Int = 20, $offset: Int = 0) @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact @check(expr: "this != null") {
    activo @check(expr: "this == true")
    rol { nombre @check(expr: "this in ['admin', 'recepcionista']") }
  }
  solicitudContactos(where: { estado: { eq: $estado } }, orderBy: [{ creadoEn: DESC }, { id: DESC }], limit: $limit, offset: $offset) {
    id nombre email telefono servicio mensaje estado creadoEn actualizadoEn
  }
  total: solicitudContactos(where: { estado: { eq: $estado } }) { _count }
}

mutation ActualizarEstadoSolicitudContacto($id: UUID!, $estado: SolicitudContactoEstado!) @auth(level: USER) @transaction {
  query @redact {
    usuario(id_expr: "auth.uid") @check(expr: "this != null") {
      activo @check(expr: "this == true")
      rol { nombre @check(expr: "this in ['admin', 'recepcionista']") }
    }
  }
  solicitudContacto_update(id: $id, data: { estado: $estado, actualizadoEn_expr: "request.time" }) @check(expr: "this != null")
}
