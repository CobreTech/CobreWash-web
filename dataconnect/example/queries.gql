# Catálogo de roles para el selector de registro.
query GetRoles @auth(level: PUBLIC, insecureReason: "Catálogo de roles sin datos sensibles, necesario antes de iniciar sesión") {
  rols(orderBy: [{ nombre: ASC }]) {
    id
    nombre
    descripcion
  }
}

# Perfil completo del usuario autenticado: se usa para decidir a dónde
# redirigirlo tras iniciar sesión y para mostrar sus datos en /cuenta.
query GetMiPerfil @auth(level: USER) {
  usuario(id_expr: "auth.uid") {
    id
    rut
    nombre
    apellido
    email
    telefono
    activo
    creadoEn
    rol {
      id
      nombre
      descripcion
    }
    clientes_on_usuario {
      id
      tipoCliente
      direccion
    }
  }
}

# Lista de todas las cuentas del sistema. Solo accesible para administradores
# (verificado contra la tabla usuario/rol, no contra un claim del token).
query GetUsuarios @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(expr: "this == 'admin'", message: "Solo administradores pueden ver la lista de usuarios")
    }
  }
  usuarios(orderBy: [{ creadoEn: DESC }]) {
    id
    rut
    nombre
    apellido
    email
    telefono
    activo
    creadoEn
    rol {
      id
      nombre
    }
  }
}

# Consulta pública y acotada para leer el QR impreso en la comanda.
# No expone datos personales del cliente ni del personal.
query GetComandaPorQr($codigoQr: UUID!)
  @auth(level: PUBLIC, insecureReason: "El QR de la comanda funciona como código público de seguimiento y solo expone su estado operacional") {
  comanda(first: { where: { codigoQr: { eq: $codigoQr } } }) {
    id
    codigoQr
    numeroComanda
    estado
    fechaRecepcion
    fechaEntregaEstimada
    fechaEntregaReal
    actualizadoEn
    comandaDetalles_on_comanda {
      cantidad
      pesoKg
      tipoPrenda { nombre }
      tipoServicio { nombre }
    }
  }
}

# Los códigos QR de inventario solo pueden ser consultados por producción
# o administración; escanear un código no evita la autorización.
query GetInsumoPorQr($codigoQr: UUID!) @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(
        expr: "this in ['admin', 'operario']"
        message: "Solo administradores y operarios pueden escanear insumos"
      )
    }
  }
  insumo(first: { where: { codigoQr: { eq: $codigoQr }, activo: { eq: true } } }) {
    id
    codigoQr
    nombre
    unidadMedida
    stockActual
    stockMinimo
    activo
  }
}

# Catálogo de vehículos disponible para administración y repartidores.
query GetVehiculos @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(
        expr: "this in ['admin', 'repartidor']"
        message: "Acceso reservado a administración y reparto"
      )
    }
  }
  vehiculos(orderBy: [{ patente: ASC }]) {
    id
    patente
    marca
    modelo
    anio
    descripcion
    activo
    creadoEn
  }
}

# Cada repartidor ve únicamente las salidas que tiene asignadas.
query GetMisSalidasVehiculo @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(
        expr: "this == 'repartidor'"
        message: "Acceso reservado a repartidores"
      )
    }
  }
  salidaVehiculos(
    where: { repartidorId: { eq_expr: "auth.uid" } }
    orderBy: [{ creadoEn: DESC }]
  ) {
    id
    estado
    fechaSalida
    fechaRetorno
    observaciones
    creadoEn
    vehiculo {
      id
      patente
      marca
      modelo
    }
    inspeccionVehiculos_on_salida(orderBy: [{ registradoEn: ASC }]) {
      id
      momento
      estadoVehiculo
      kilometraje
      observaciones
      registradoEn
      fotoInspeccionVehiculos_on_inspeccion(orderBy: [{ orden: ASC }]) {
        id
        rutaStorage
        descripcion
        orden
      }
    }
  }
}

# ==================== COMANDAS (SPRINT 03) ====================

query GetComandas @auth(level: USER) {
  comandas(orderBy: [{ creadoEn: DESC }]) {
    id
    numeroComanda
    codigoQr
    estado
    valorTotal
    fechaRecepcion
    fechaEntregaEstimada
    observaciones
    motivoAnulacion
    cliente {
      id
      nombre
      telefono
      email
      tipoCliente
      direccion
    }
    comandaDetalles_on_comanda {
      cantidad
      precioUnitario
      tipoPrenda { nombre }
      tipoServicio { nombre }
    }
  }
}

query GetComandaDetalle($id: UUID!) @auth(level: USER) {
  comanda(id: $id) {
    id
    numeroComanda
    estado
    valorTotal
    observaciones
    motivoAnulacion
    fechaRecepcion
    fechaEntregaEstimada
    cliente {
      id
      nombre
      telefono
      email
      tipoCliente
      direccion
    }
    comandaDetalles_on_comanda {
      id
      cantidad
      pesoKg
      precioUnitario
      subtotal
      tipoPrenda {
        id
        nombre
      }
      tipoServicio {
        id
        nombre
      }
    }
    comandaHistorialEstados_on_comanda(orderBy: [{ fecha: DESC }]) {
      id
      estadoAnterior
      estadoNuevo
      fecha
      motivo
      usuario {
        nombre
      }
    }
  }
}

query GetCatalogosComanda @auth(level: USER) {
  tipoServicios(where: { activo: { eq: true } }) {
    id
    nombre
    precioBase
    unidadCobro
  }
  tipoPrendas(where: { activo: { eq: true } }) {
    id
    nombre
  }
  clientes(orderBy: [{ nombre: ASC }]) {
    id
    nombre
    tipoCliente
    telefono
    email
    direccion
  }
}

