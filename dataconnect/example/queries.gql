# Catálogo de roles para el selector de registro.
query GetRoles @auth(level: PUBLIC, insecureReason: "Catálogo de roles sin datos sensibles, necesario antes de iniciar sesión") {
  rols(orderBy: [{ nombre: ASC }]) {
    id
    nombre
    descripcion
  }
}

# Perfil completo del usuario autenticado: se usa para decidir a dónde
# redirigirlo tras iniciar sesión y para mostrar sus datos en /cuenta.
query GetMiPerfil @auth(level: USER) {
  usuario(id_expr: "auth.uid") {
    id
    rut
    nombre
    apellido
    email
    telefono
    activo
    creadoEn
    rol {
      id
      nombre
      descripcion
    }
    clientes_on_usuario {
      id
      tipoCliente
      direccion
    }
  }
}

# Lista de todas las cuentas del sistema. Solo accesible para administradores
# (verificado contra la tabla usuario/rol, no contra un claim del token).
query GetUsuarios @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(expr: "this == 'admin'", message: "Solo administradores pueden ver la lista de usuarios")
    }
  }
  usuarios(orderBy: [{ creadoEn: DESC }]) {
    id
    rut
    nombre
    apellido
    email
    telefono
    activo
    creadoEn
    rol {
      id
      nombre
    }
  }
}

# Consulta pública y acotada para leer el QR impreso en la comanda.
# No expone datos personales del cliente ni del personal.
query GetComandaPorQr($codigoQr: UUID!)
  @auth(level: PUBLIC, insecureReason: "El QR de la comanda funciona como código público de seguimiento y solo expone su estado operacional") {
  comanda(first: { where: { codigoQr: { eq: $codigoQr } } }) {
    id
    codigoQr
    numeroComanda
    estado
    fechaRecepcion
    fechaEntregaEstimada
    fechaEntregaReal
    actualizadoEn
    comandaDetalles_on_comanda {
      cantidad
      pesoKg
      precioUnitario
      tipoPrenda { nombre }
      tipoServicio { nombre }
    }
  }
}

# Los códigos QR de inventario solo pueden ser consultados por producción
# o administración; escanear un código no evita la autorización.
query GetInsumoPorQr($codigoQr: UUID!) @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(
        expr: "this in ['admin', 'operario']"
        message: "Solo administradores y operarios pueden escanear insumos"
      )
    }
  }
  insumo(first: { where: { codigoQr: { eq: $codigoQr }, activo: { eq: true } } }) {
    id
    codigoQr
    nombre
    unidadMedida
    stockActual
    stockMinimo
    activo
  }
}

# Catálogo de vehículos disponible para administración y repartidores.
query GetVehiculos @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(
        expr: "this in ['admin', 'repartidor']"
        message: "Acceso reservado a administración y reparto"
      )
    }
  }
  vehiculos(orderBy: [{ patente: ASC }]) {
    id
    patente
    marca
    modelo
    anio
    descripcion
    activo
    creadoEn
  }
}

# Cada repartidor ve únicamente las salidas que tiene asignadas.
query GetMisSalidasVehiculo @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(
        expr: "this == 'repartidor'"
        message: "Acceso reservado a repartidores"
      )
    }
  }
  salidaVehiculos(
    where: { repartidorId: { eq_expr: "auth.uid" } }
    orderBy: [{ creadoEn: DESC }]
  ) {
    id
    estado
    fechaSalida
    fechaRetorno
    observaciones
    creadoEn
    vehiculo {
      id
      patente
      marca
      modelo
    }
    inspeccionVehiculos_on_salida(orderBy: [{ registradoEn: ASC }]) {
      id
      momento
      estadoVehiculo
      kilometraje
      observaciones
      registradoEn
      fotoInspeccionVehiculos_on_inspeccion(orderBy: [{ orden: ASC }]) {
        id
        rutaStorage
        descripcion
        orden
      }
    }
  }
}

# ==================== COMANDAS (SPRINT 03) ====================

# Contrato anterior conservado mientras los previews existentes migran a la
# consulta paginada. Las nuevas versiones no deben utilizar esta operación.
query GetComandas(
  $limit: Int = 8
  $offset: Int = 0
  $estado: ComandaEstado
  $cliente: String
  $fechaDesde: Timestamp
  $fechaHasta: Timestamp
) @auth(level: USER) @retired(reason: "Usar GetComandasPaginadas") {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(expr: "this == 'admin' || this == 'recepcionista'", message: "No autorizado para listar comandas")
    }
  }
  comandas(
    where: {
      estado: { eq: $estado }
      cliente: { nombre: { contains: $cliente } }
      fechaRecepcion: { ge: $fechaDesde, le: $fechaHasta }
    }
    orderBy: [{ creadoEn: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    numeroComanda
    codigoQr
    estado
    valorTotal
    empresa
    proyecto
    fechaRecepcion
    fechaEntregaEstimada
    observaciones
    motivoAnulacion
    cliente {
      id
      nombre
      telefono
      email
      tipoCliente
      direccion
    }
    comandaDetalles_on_comanda {
      cantidad
      detalle
      precioUnitario
      tipoPrenda { nombre }
      tipoServicio { nombre }
    }
  }
  total: comandas(
    where: {
      estado: { eq: $estado }
      cliente: { nombre: { contains: $cliente } }
      fechaRecepcion: { ge: $fechaDesde, le: $fechaHasta }
    }
  ) { _count }
  pendientes: comandas(where: { estado: { eq: PENDIENTE } }) { _count }
  enProceso: comandas(where: { estado: { eq: EN_PROCESO } }) { _count }
  finalizadas: comandas(where: { estado: { eq: FINALIZADA } }) { _count }
  entregadas: comandas(where: { estado: { eq: ENTREGADA } }) { _count }
  anuladas: comandas(where: { estado: { eq: ANULADA } }) { _count }
}

query GetComandasPaginadas(
  $limit: Int = 8
  $offset: Int = 0
  $estado: ComandaEstado
  $cliente: String
  $fechaDesde: Timestamp
  $fechaHasta: Timestamp
) @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(expr: "this == 'admin' || this == 'recepcionista'", message: "No autorizado para listar comandas")
    }
  }
  comandas(
    where: {
      estado: { eq: $estado }
      cliente: { nombre: { contains: $cliente } }
      fechaRecepcion: { ge: $fechaDesde, le: $fechaHasta }
    }
    orderBy: [{ creadoEn: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    numeroComanda
    codigoQr
    estado
    valorTotal
    empresa
    proyecto
    fechaRecepcion
    fechaEntregaEstimada
    observaciones
    motivoAnulacion
    cliente {
      id
      nombre
      telefono
      email
      tipoCliente
      direccion
    }
    comandaDetalles_on_comanda {
      cantidad
      detalle
      precioUnitario
      tipoPrenda { nombre }
      tipoServicio { nombre }
    }
  }
  total: comandas(
    where: {
      estado: { eq: $estado }
      cliente: { nombre: { contains: $cliente } }
      fechaRecepcion: { ge: $fechaDesde, le: $fechaHasta }
    }
  ) {
    _count
  }
  pendientes: comandas(where: { estado: { eq: PENDIENTE } }) { _count }
  enProceso: comandas(where: { estado: { eq: EN_PROCESO } }) { _count }
  finalizadas: comandas(where: { estado: { eq: FINALIZADA } }) { _count }
  entregadas: comandas(where: { estado: { eq: ENTREGADA } }) { _count }
  anuladas: comandas(where: { estado: { eq: ANULADA } }) { _count }
}

query GetComandaDetalle($id: UUID!) @auth(level: USER) {
  comanda(id: $id) {
    id
    numeroComanda
    estado
    valorTotal
    empresa
    proyecto
    observaciones
    motivoAnulacion
    fechaRecepcion
    fechaEntregaEstimada
    cliente {
      id
      nombre
      telefono
      email
      tipoCliente
      direccion
    }
    comandaDetalles_on_comanda {
      id
      cantidad
      detalle
      pesoKg
      precioUnitario
      subtotal
      tipoPrenda {
        id
        nombre
      }
      tipoServicio {
        id
        nombre
      }
    }
    comandaHistorialEstados_on_comanda(orderBy: [{ fecha: DESC }]) {
      id
      estadoAnterior
      estadoNuevo
      fecha
      motivo
      usuario {
        nombre
      }
    }
  }
}

query GetCatalogosComanda @auth(level: USER) {
  tipoServicios(where: { activo: { eq: true } }) {
    id
    nombre
    precioBase
    unidadCobro
  }
  tipoPrendas(where: { activo: { eq: true } }) {
    id
    nombre
  }
  clientes(orderBy: [{ nombre: ASC }]) {
    id
    rut
    nombre
    tipoCliente
    telefono
    email
    direccion
  }
}

# Diagnóstico operativo de solo lectura. NO_ACCESS impide invocarlo desde la
# aplicación; se utiliza únicamente con credenciales administrativas del CLI.
query DiagnosticoComandas @auth(level: NO_ACCESS) {
  tipoPrendas(orderBy: [{ nombre: ASC }]) {
    id
    nombre
    activo
  }
  tipoServicios(orderBy: [{ nombre: ASC }]) {
    id
    nombre
    activo
    precioBase
  }
  comandas(orderBy: [{ creadoEn: DESC }], limit: 20) {
    id
    numeroComanda
    valorTotal
    comandaDetalles_on_comanda {
      id
      cantidad
      precioUnitario
      subtotal
      tipoPrenda {
        id
        nombre
      }
      tipoServicio {
        id
        nombre
      }
    }
  }
}

# Fichas administrativas de clientes para recepción y administración. Incluye
# sus comandas para calcular métricas sin depender de datos mock.
query GetFichasClientes @auth(level: USER) {
  yo: usuario(id_expr: "auth.uid") @redact {
    activo @check(expr: "this == true", message: "La cuenta está inactiva")
    rol {
      nombre @check(expr: "this == 'admin' || this == 'recepcionista'", message: "No autorizado para listar clientes")
    }
  }
  clientes(orderBy: [{ nombre: ASC }]) {
    id
    rut
    nombre
    tipoCliente
    telefono
    email
    direccion
    creadoEn
    comandas_on_cliente(orderBy: [{ creadoEn: DESC }]) {
      id
      estado
      valorTotal
      fechaRecepcion
      comandaDetalles_on_comanda {
        cantidad
      }
    }
  }
}

