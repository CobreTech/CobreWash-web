# Importación de CSV del módulo IA. Vive en este conector porque el generador
# del SDK web aún no admite listas _Data; /api/ia/importar la ejecuta con el
# SDK Admin después de verificar que quien llama es administrador.

# Conteos y compras históricos: quedan en el registro pero no cambian el stock actual.
mutation ImportarConteosIa($conteos: [ConteoInventario_Data!]!) @auth(level: NO_ACCESS) @transaction {
  conteoInventario_insertMany(data: $conteos)
}

mutation ImportarComprasIa($compras: [MovimientoInventario_Data!]!) @auth(level: NO_ACCESS) @transaction {
  movimientoInventario_insertMany(data: $compras)
}
