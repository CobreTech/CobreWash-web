name: Security & Compliance

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1' # Ejecutar todos los lunes para monitorear dependencias

permissions:
  contents: read
  security-events: write

jobs:
  analyze-sast:
    name: SAST (CodeQL - OWASP Top 10)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # CodeQL escanea el código en busca de inyecciones, XSS, etc. (OWASP Top 10)
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, typescript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:javascript,typescript"

  audit-dependencies:
    name: SCA (Dependencias y CVEs)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 11

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Auditoría de vulnerabilidades en paquetes de terceros
    - name: Run dependency audit
      run: pnpm audit --audit-level=high
