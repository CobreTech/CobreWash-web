allowBuilds:
  '@firebase/util': false
  protobufjs: false
  core-js: false
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

packages:
  - '.'

overrides:
  next: "^16.3.3"
  browserslist: "4.28.7"
  sharp: ">=0.35.0"
  js-yaml: ">=4.3.1"
  nanoid: ">=3.3.18"
  postcss: ">=8.5.18"
  # Fix both gRPC advisories, including Firebase's older transitive dependency.
  '@grpc/grpc-js': "^1.14.5"
  # Next's plugin only uses globSync with onlyDirectories. tinyglobby supports
  # that API without pulling in vulnerable braces (no patched release yet).
  '@next/eslint-plugin-next>fast-glob': "npm:tinyglobby@0.2.17"
  # Preserve CommonJS support and the v4 API used by gaxios.
  'gaxios>uuid': "11.1.1"
  # ExcelJS uses uuid.v4; v11 keeps that API and CommonJS with the security fix.
  'exceljs>uuid': "11.1.1"
